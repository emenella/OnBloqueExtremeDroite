<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<body>
  <header>
    <div class="brand">
      <span class="logo">🚫</span>
      <div><h1>Bloqueur auto</h1><small>onbloquelextremedroite.fun</small></div>
    </div>
    <span class="pill" id="pill"><i></i><span id="pillTxt">Inactif</span></span>
  </header>

  <section class="hero">
    <div class="ringwrap">
      <svg viewBox="0 0 80 80">
        <circle class="bg" cx="40" cy="40" r="34"/>
        <circle class="fg" id="fg" cx="40" cy="40" r="34"/>
      </svg>
      <div class="ringtxt"><b id="n">0</b><small id="of">/ 20</small></div>
    </div>
    <div class="hero-info">
      <div class="label">Aujourd'hui</div>
      <div class="big" id="left">—</div>
      <div class="label">Total : <b id="total">0</b></div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div><div class="t">Vérifier chaque profil</div><small>Confirmation avant de bloquer</small></div>
      <label class="sw"><input type="checkbox" id="confirm"><span></span></label>
    </div>
    <div class="row">
      <div><div class="t">Sans limite</div><small>Ignore le maximum par jour</small></div>
      <label class="sw"><input type="checkbox" id="unlimited"><span></span></label>
    </div>
    <div class="row" id="capRow">
      <div class="t">Maximum par jour</div>
      <div class="stepper">
        <button id="minus" type="button">−</button>
        <input type="number" id="cap" min="1">
        <button id="plus" type="button">+</button>
      </div>
    </div>
  </section>

  <footer>
  <a class="btn" href="https://onbloquelextremedroite.fun/" target="_blank" rel="noopener">
    Ouvrir le site ↗
  </a>
  <button id="reset" type="button">Réinitialiser le compteur du jour</button>
  <p class="credit">
    Créé par
    <a href="https://github.com/emenella" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      emenella

  </p>
</footer>

  <script src="popup.js"></script>
</body>
</html>
